<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="box">
    <input id="display" readonly>
    <div class="con">
        <button class="o" onclick="add('+')">+</button>
        <button class="b" onclick="add('7')">7</button>
        <button class="b" onclick="add('8')">8</button>
        <button class="b" onclick="add('9')">9</button>
    </div>
    <div class="con">
        <button class="o">-</button>
        <button class="b">4</button>
        <button class="b">5</button>
        <button class="b">6</button>
    </div>
    <div class="con">
        <button class="o">*</button>
        <button class="b">1</button>
        <button class="b">2</button>
        <button class="b">3</button>
    </div>
    <div class="con">
        <button class="o">/</button>
        <button class="b">0</button>
        <button class="b">.</button>
        <button class="b">=<button> 
             </div>
       <div class="con">
        <button class="o">C</button>
       </div>  
   
    </div>
    <script src="./main.js"></script>
</body>
</html>
